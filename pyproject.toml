[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "weather-sdk"
version = "0.1.0"
description = "A simple SDK for the OpenWeatherMap API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.9",
    "wemake-python-styleguide>=0.19",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
