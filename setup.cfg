[flake8]
max-line-length = 79
max-complexity = 6
max-local-variables = 7
max-methods = 10
max-module-members = 10
extend-ignore =
    WPS226,
    WPS306,
    WPS410,
    WPS412,
    WPS432,

per-file-ignores =
    tests/*.py: WPS202

[mypy]
python_version = 3.11
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true

[tool:pytest]
testpaths = tests
